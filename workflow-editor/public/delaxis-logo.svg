<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Delaxis logo">
  <!-- The Delaxis mark in Graphite: three nodes stepping along a diagonal axis on
       a rounded tile. The accent is monochrome, so the leading node is told apart
       by weight — solid — while the two behind it step back. Geometry from the
       delaxis-tile-graphite brand asset; keep in sync with
       src/components/DelaxisLogo.tsx.

       An SVG favicon can respond to the browser's colour scheme, so the tile
       inverts rather than disappearing against a matching tab bar. -->
  <style>
    .tile { fill: #1d1d1f; }
    .node { fill: #f5f5f7; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f7; }
      .node { fill: #1d1d1f; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="24"/>
  <circle class="node" cx="24" cy="76" r="9" fill-opacity="0.45"/>
  <circle class="node" cx="50" cy="50" r="9" fill-opacity="0.72"/>
  <circle class="node" cx="76" cy="24" r="9"/>
</svg>
