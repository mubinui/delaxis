<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Delaxis logo">
  <defs>
    <linearGradient id="delaxisTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="delaxisSheen" cx="0.25" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#delaxisTile)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#delaxisSheen)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- Axis star: three rays at 120 degrees from a single origin, each capped by
       an agent node. Drawn as tapered triangles rather than strokes so the mark
       keeps its weight when rasterised down to a 16px favicon. The origin sits
       at y=28.5 rather than 32 so the two-up/one-down arrangement reads as
       optically centred. Keep in sync with src/components/DelaxisLogo.tsx. -->
  <g fill="#ffffff">
    <path d="M29.2 28.5 L34.8 28.5 L32 44 Z"/>
    <path d="M33.4 26.08 L30.6 30.92 L18.6 20.75 Z"/>
    <path d="M33.4 30.92 L30.6 26.08 L45.4 20.75 Z"/>
    <circle cx="32" cy="28.5" r="5.2"/>
    <circle cx="32" cy="44" r="6.2"/>
    <circle cx="18.6" cy="20.75" r="6.2"/>
    <circle cx="45.4" cy="20.75" r="6.2"/>
  </g>
</svg>
