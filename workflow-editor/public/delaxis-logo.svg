<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Delaxis logo">
  <!-- The Delaxis mark: three nodes stepping along a diagonal axis on a rounded
       tile, leading node in the brand blue. Geometry from the
       delaxis-tile-paper-blue brand asset; keep in sync with
       src/components/DelaxisLogo.tsx.

       An SVG favicon can respond to the browser's colour scheme, so the tile
       inverts rather than disappearing against a matching tab bar. -->
  <style>
    .tile { fill: #1d2530; }
    .node { fill: #f6f5f2; }
    .lead { fill: #3b7ef5; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f6f5f2; }
      .node { fill: #1d2530; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="24"/>
  <circle class="node" cx="24" cy="76" r="9"/>
  <circle class="node" cx="50" cy="50" r="9"/>
  <circle class="lead" cx="76" cy="24" r="9"/>
</svg>
