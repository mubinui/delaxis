<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delaxis 2.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
/* The card is built from the Studio's own tokens and mark rather than a
   separate title design, so the video opens on the product's actual identity.

   Nothing here ever sits still. A title card that finishes animating and then
   holds for three seconds reads as a slide; a slow continuous push keeps it
   reading as a shot, and gives the dissolve into the app something to carry. */
:root {
    --ink: #0a0d14;
    --paper: #f2f5fa;
    --muted: #8892a5;
    --accent: #5b7cff;
    --violet: #a476ff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Two very low-opacity washes, the same treatment the dark Studio uses, drifting
   against each other so the background is never quite the same frame twice. */
.wash {
    position: fixed;
    inset: -15%;
    background-image:
        radial-gradient(ellipse 60% 55% at 42% 34%, rgba(91, 124, 255, 0.20), transparent 70%),
        radial-gradient(ellipse 45% 45% at 78% 88%, rgba(164, 118, 255, 0.13), transparent 70%);
    animation: drift 24s ease-in-out infinite alternate;
}

/* Darkened corners pull the eye to the mark and hide the flat edges of the
   gradients. */
.vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.55));
    pointer-events: none;
}

@keyframes drift {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1.05); }
    to   { transform: translate3d(1.5%, 1.5%, 0) scale(1.12); }
}

/* The slow push. Runs the whole length of the card, well past the point the
   build-on finishes. */
.stage {
    position: relative;
    text-align: center;
    animation: push 9s cubic-bezier(0.33, 0, 0.25, 1) forwards;
}

@keyframes push {
    from { transform: scale(1.045) translateY(10px); }
    to   { transform: scale(1) translateY(-14px); }
}

/* ---- the mark draws itself ------------------------------------------------ */

.mark { width: 200px; height: 200px; margin: 0 auto 44px; display: block; overflow: visible; }

.axis {
    stroke: var(--paper);
    stroke-width: 6;
    stroke-linecap: round;
    opacity: 0.32;
    stroke-dasharray: 74;
    stroke-dashoffset: 74;
    animation: draw 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
}

.node {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: pop 0.62s cubic-bezier(0.34, 1.6, 0.5, 1) forwards;
}
.node.a { animation-delay: 0.62s; }
.node.b { animation-delay: 0.80s; }
.node.c { animation-delay: 0.98s; }

/* A ring leaves the leading node as it lands — the graph came alive rather than
   simply appearing. */
.ping {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: ping 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.05s infinite;
}

/* A signal running the axis, because this is a graph with work moving through
   it and not a static logo. */
.signal {
    fill: var(--accent);
    opacity: 0;
    animation: travel 2.6s cubic-bezier(0.5, 0, 0.5, 1) 1.5s infinite;
}

@keyframes draw { to { stroke-dashoffset: 0; } }

@keyframes pop {
    0%   { opacity: 0; transform: scale(0.15); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes ping {
    0%   { opacity: 0.75; transform: scale(0.6); }
    70%  { opacity: 0; transform: scale(2.4); }
    100% { opacity: 0; transform: scale(2.4); }
}

/* Travels from the lower-left node to the upper-right one: 52 user units along
   each axis, which the 200px box renders as a clean diagonal. */
@keyframes travel {
    0%   { opacity: 0; transform: translate(0, 0); }
    12%  { opacity: 0.9; }
    78%  { opacity: 0.9; transform: translate(52px, -52px); }
    100% { opacity: 0; transform: translate(52px, -52px); }
}

/* ---- type ----------------------------------------------------------------- */

h1 {
    font-size: 108px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
}

/* A light sweeps across the wordmark once it has settled. Cheap to render and
   it is the moment the card stops looking like a web page. */
.word {
    background: linear-gradient(100deg,
        var(--paper) 42%, #ffffff 48%, #ffffff 52%, var(--paper) 58%);
    background-size: 320% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation:
        rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards,
        sheen 4.5s cubic-bezier(0.4, 0, 0.2, 1) 2.1s infinite;
}

.version {
    align-self: flex-start;
    margin-top: 12px;
    padding: 8px 18px;
    border: 1px solid rgba(91, 124, 255, 0.45);
    border-radius: 999px;
    background: rgba(91, 124, 255, 0.12);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--accent);
    opacity: 0;
    animation: badge 0.6s cubic-bezier(0.34, 1.5, 0.55, 1) 1.45s forwards;
}

p {
    margin-top: 26px;
    font-size: 31px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.005em;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.62s forwards;
}

.rule {
    width: 0;
    height: 2px;
    margin: 42px auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), var(--violet), transparent);
    animation: widen 1.6s cubic-bezier(0.22, 1, 0.36, 1) 1.9s forwards;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes badge {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
}
@keyframes sheen {
    0%        { background-position: 100% 0; }
    45%, 100% { background-position: -100% 0; }
}
@keyframes widen { to { width: 640px; } }
</style>
</head>
<body>
<div class="wash"></div>

<div class="stage">
    <svg class="mark" viewBox="0 0 100 100" fill="none" aria-label="Delaxis">
        <line class="axis" x1="24" y1="76" x2="76" y2="24" />
        <circle class="signal" cx="24" cy="76" r="5" />
        <g class="node a"><circle cx="24" cy="76" r="11" fill="#f2f5fa" /></g>
        <g class="node b"><circle cx="50" cy="50" r="11" fill="#f2f5fa" /></g>
        <g class="node c"><circle cx="76" cy="24" r="11" fill="#5b7cff" /></g>
        <circle class="ping" cx="76" cy="24" r="11" />
    </svg>

    <h1><span class="word">Delaxis</span><span class="version">2.1</span></h1>
    <p>Build multi-agent systems by describing what you want</p>
    <div class="rule"></div>
</div>

<div class="vignette"></div>
</body>
</html>
