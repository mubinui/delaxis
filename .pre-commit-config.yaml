repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict

  # Run the tools from the project's own lockfile so pre-commit, CI and a
  # developer's shell all use the same versions.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        pass_filenames: false
        files: ^src/
      - id: eslint
        name: eslint (studio)
        entry: bash -c 'cd workflow-editor && npx eslint --max-warnings 0 "$@"' --
        language: system
        files: ^workflow-editor/src/.*\.(ts|tsx)$
