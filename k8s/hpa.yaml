# Delaxis keeps sessions in process, so it runs as a single replica; this
# autoscaler is pinned to one until a shared session store exists.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: delaxis-hpa
  namespace: delaxis
  labels:
    app: delaxis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: delaxis
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
