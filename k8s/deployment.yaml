apiVersion: apps/v1
kind: Deployment
metadata:
  name: delaxis
  namespace: delaxis
  labels:
    app: delaxis
    version: v1
spec:
  # One replica: sessions live in process and configs, uploads and the SQLite
  # database live on the data volume (ReadWriteOnce). More replicas would each
  # see different sessions and could not attach the same volume.
  replicas: 1
  strategy:
    type: Recreate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: delaxis
  template:
    metadata:
      labels:
        app: delaxis
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: delaxis
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      # Run database migrations before starting the app
      - name: db-migration
        image: delaxis:latest
        command: ["alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: delaxis-secrets
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: delaxis-config
        - secretRef:
            name: delaxis-secrets
      
      containers:
      - name: delaxis
        image: delaxis:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # Inject all config from ConfigMap and Secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: delaxis-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: delaxis-secrets
              key: REDIS_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: delaxis-secrets
              key: RABBITMQ_URL
        
        envFrom:
        - configMapRef:
            name: delaxis-config
        - secretRef:
            name: delaxis-secrets
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        volumeMounts:
        # Configs edited in the Studio, sessions, deployments, uploads, SQLite.
        - name: data
          mountPath: /app/data
        - name: chromadb-storage
          mountPath: /app/data/chromadb
        - name: config-volume
          mountPath: /app/configs
          readOnly: true
      
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: delaxis-data-pvc
      - name: chromadb-storage
        persistentVolumeClaim:
          claimName: chromadb-pvc
      - name: config-volume
        configMap:
          name: delaxis-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delaxis
  namespace: delaxis
  labels:
    app: delaxis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-pvc
  namespace: delaxis
  labels:
    app: delaxis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Everything under /app/data except ChromaDB, which keeps its own claim so
# existing installations keep their vectors.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delaxis-data-pvc
  namespace: delaxis
  labels:
    app: delaxis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
